name: docdoc
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # HTTP and networking
  dio: ^5.6.0
  retrofit: ^4.2.0
  pretty_dio_logger: ^1.4.0
  # Firebase
  firebase_core: ^3.6.0
  # State management
  flutter_bloc: ^8.1.6
  # UI and utilities
  flutter_native_splash: ^2.4.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  easy_localization: ^3.0.7
  intl: ^0.19.0
  # Code generation and dependency injection
  build_runner: ^2.4.11
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4
  get_it: ^7.7.0
  json_annotation: ^4.9.0
  retrofit_generator: ^8.1.2
  convex_bottom_bar: ^3.2.0
  shared_preferences:
  flutter_secure_storage:
  shimmer:  
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svgs/
